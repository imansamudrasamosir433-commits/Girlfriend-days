<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Girlfriend Day! 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fefae0, #fde2e4, #e2ece9);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      color: #4a4a4a;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Container Kartu Utama */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 25px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(230, 175, 185, 0.3);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 2;
    }

    .welcome-screen h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #e07a5f;
      margin-bottom: 10px;
    }

    .welcome-screen p {
      font-size: 0.95rem;
      color: #6c757d;
      margin-bottom: 25px;
    }

    .btn-open {
      background: #f4a261;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(244, 162, 97, 0.4);
      transition: all 0.3s ease;
    }

    .btn-open:hover {
      transform: translateY(-2px);
      background: #e76f51;
    }

    /* Content Area */
    .content-screen {
      display: none;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #d62828;
      margin-bottom: 15px;
    }

    /* Slideshow Container */
    .slideshow-container {
      position: relative;
      width: 100%;
      height: 280px;
      border-radius: 14px;
      overflow: hidden;
      margin: 15px 0 20px 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 4px solid #fff;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Message Box */
    .message-box {
      background: #fffdf9;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 120px;
      border: 1px solid #f1e3d3;
      margin-bottom: 20px;
      position: relative;
    }

    /* Floating Hearts */
    .heart {
      position: fixed;
      font-size: 20px;
      color: #ffb7b2;
      pointer-events: none;
      animation: float 4s linear infinite;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .music-badge {
      font-size: 0.8rem;
      color: #8d99ae;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
  </style>
</head>
<body>

  <!-- Audio Musik -->
  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
  </audio>

  <div class="card">
    <!-- Screen 1: Layar Depan -->
    <div class="welcome-screen" id="welcomeScreen">
      <h1>Halo Cantik 💕</h1>
      <p>Ada surat kecil khusus buat kamu di Hari Girlfriend Day ini...</p>
      <button class="btn-open" onclick="openSurat()">Buka Surat 💌</button>
    </div>

    <!-- Screen 2: Isi Pesan & Slideshow Foto -->
    <div class="content-screen" id="contentScreen">
      <h2 class="title">Happy Girlfriend Day! ✨</h2>
      
      <!-- Frame Slider Foto (Ganti URL foto-foto di bawah) -->
      <div class="slideshow-container">
        <img class="slide active" src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=600&auto=format&fit=crop" alt="Foto 1">
        <img class="slide" src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600&auto=format&fit=crop" alt="Foto 2">
        <img class="slide" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600&auto=format&fit=crop" alt="Foto 3">
        <img class="slide" src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=600&auto=format&fit=crop" alt="Foto 4">
        <img class="slide" src="https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=600&auto=format&fit=crop" alt="Foto 5">
        <img class="slide" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&auto=format&fit=crop" alt="Foto 6">
      </div>

      <!-- Kotak Pesan Animasi Ketik -->
      <div class="message-box">
        <p id="typewriter"></p>
      </div>

      <button class="btn-open" onclick="kirimCinta()">Makasih Sayang 💖</button>

      <div class="music-badge">
        🎵 Playing background music...
      </div>
    </div>
  </div>

  <script>
    const pesanUcapan = "Selamat National Girlfriend Day ya! Terima kasih udah selalu hadir, senyum kamu selalu jadi hal favoritku tiap hari. Maaf ya cuma bisa kasih website sederhana ini, tapi rasa sayang aku ke kamu beneran ga sederhana. Love you always! ✨❤️";

    let index = 0;
    let currentSlide = 0;

    function openSurat() {
      document.getElementById("welcomeScreen").style.display = "none";
      document.getElementById("contentScreen").style.display = "block";

      const music = document.getElementById("bgMusic");
      music.play().catch(e => console.log("Autoplay dibatasi browser"));

      typeWriter();
      setInterval(createHeart, 400);
      
      // Jalankan slider foto otomatis berganti tiap 3000ms (3 detik)
      setInterval(nextSlide, 3000);
    }

    function nextSlide() {
      const slides = document.querySelectorAll('.slide');
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    function typeWriter() {
      if (index < pesanUcapan.length) {
        document.getElementById("typewriter").innerHTML += pesanUcapan.charAt(index);
        index++;
        setTimeout(typeWriter, 45);
      }
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "🌸";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 2 + 3 + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    function kirimCinta() {
      alert("I love you more! ❤️");
    }
  </script>
</body>
</html>
